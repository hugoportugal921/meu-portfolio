name: finflow
services:
 sqlserver:
  image: mcr.microsoft.com/mssql/server:2022-latest
  environment:
   ACCEPT_EULA: "Y"
   MSSQL_PID: Developer
   MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Run scripts/init-env.py first}
  ports: ["127.0.0.1:1433:1433"]
  volumes: ["sql-data:/var/opt/mssql"]
  healthcheck:
   test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
   interval: 5s
   timeout: 5s
   retries: 30
   start_period: 20s
  restart: unless-stopped
 rabbitmq:
  image: rabbitmq:4.1-management
  hostname: rabbitmq
  environment:
   RABBITMQ_DEFAULT_USER: finflow
   RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/init-env.py first}
  ports: ["127.0.0.1:15672:15672"]
  volumes: ["rabbit-data:/var/lib/rabbitmq"]
  healthcheck:
   test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
   interval: 5s
   timeout: 5s
   retries: 20
  restart: unless-stopped
 transactions:
  build:
   context: .
   args: {SERVICE: Transactions}
  environment:
   ASPNETCORE_ENVIRONMENT: Development
   Auth__Mode: Development
   Auth__SigningKey: ${JWT_SIGNING_KEY:?Run scripts/init-env.py first}
   ConnectionStrings__Database: "Server=sqlserver,1433;Database=FinFlowTransactions;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
   RabbitMQ__Uri: "amqp://finflow:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
  ports: ["127.0.0.1:5001:8080"]
  depends_on:
   sqlserver: {condition: service_healthy}
   rabbitmq: {condition: service_healthy}
  restart: unless-stopped
 ledger:
  build:
   context: .
   args: {SERVICE: Ledger}
  environment:
   ASPNETCORE_ENVIRONMENT: Development
   Auth__Mode: Development
   Auth__SigningKey: ${JWT_SIGNING_KEY:?Run scripts/init-env.py first}
   SeedDemo: "true"
   ConnectionStrings__Database: "Server=sqlserver,1433;Database=FinFlowLedger;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
   RabbitMQ__Uri: "amqp://finflow:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
  ports: ["127.0.0.1:5002:8080"]
  depends_on:
   sqlserver: {condition: service_healthy}
   rabbitmq: {condition: service_healthy}
  restart: unless-stopped
 web:
  build: {context: ./web}
  ports: ["127.0.0.1:8080:8080"]
  depends_on: [transactions,ledger]
  restart: unless-stopped
volumes:
 sql-data:
 rabbit-data:
