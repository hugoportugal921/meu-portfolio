server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 client_max_body_size 16k;
 location /api/transfers { proxy_pass http://transactions:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
 location /api/accounts { proxy_pass http://ledger:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
 location = /dev/token { proxy_pass http://transactions:8080; }
 location /remotes/ { add_header Cache-Control no-cache; try_files $uri =404; }
 location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
}
