name: FinFlow CI
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
 unit-and-build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-dotnet@v4
     with: {dotnet-version: '8.0.428'}
   - uses: actions/setup-node@v4
     with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
   - run: dotnet test FinFlow.sln -c Release -m:1 --logger trx
   - run: dotnet publish src/FinFlow.Transactions.Api -c Release -o artifacts/transactions
   - run: dotnet publish src/FinFlow.Ledger.Api -c Release -o artifacts/ledger
   - run: npm ci && npm run typecheck && npm test && npm run build
     working-directory: web
   - uses: actions/upload-artifact@v4
     with: {name: finflow-build, path: "artifacts/\nweb/build/"}
 integration:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-dotnet@v4
     with: {dotnet-version: '8.0.428'}
   - run: python3 scripts/init-env.py
   - run: docker compose up --build -d
   - run: python3 scripts/smoke.py
   - run: python3 scripts/integration.py
   - if: always()
     run: docker compose down -v
